<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Deadline Buddy Logo</title>
  <desc id="desc">A pink smiling calendar with a clock and the Deadline Buddy name.</desc>
  <defs>
    <linearGradient id="pink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff8ba7"/>
      <stop offset="1" stop-color="#ff3f88"/>
    </linearGradient>
    <linearGradient id="darkPink" x1="0" x2="1">
      <stop offset="0" stop-color="#7a003d"/>
      <stop offset="1" stop-color="#b90f5a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7a003d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="900" height="900" rx="120" fill="#fffffe"/>
  <ellipse cx="448" cy="592" rx="258" ry="35" fill="#ffe4ee"/>

  <g filter="url(#softShadow)">
    <path d="M250 535 178 503V283c0-40 33-73 73-73h318c40 0 73 33 73 73v220l-70 32z" fill="#c90062"/>
    <rect x="227" y="208" width="430" height="355" rx="45" fill="#fffffe" stroke="#850044" stroke-width="15"/>
    <path d="M227 254c0-25 20-46 46-46h338c25 0 46 20 46 46v69H227z" fill="url(#pink)"/>
    <g fill="none" stroke="#850044" stroke-width="30" stroke-linecap="round">
      <path d="M331 223v-48"/>
      <path d="M540 223v-48"/>
    </g>
    <g fill="#ffd5e2">
      <rect x="291" y="390" width="70" height="70" rx="14"/>
      <rect x="390" y="390" width="70" height="70" rx="14"/>
      <rect x="489" y="390" width="70" height="70" rx="14"/>
      <rect x="291" y="490" width="70" height="70" rx="14"/>
      <rect x="489" y="490" width="70" height="70" rx="14"/>
    </g>
    <rect x="390" y="490" width="70" height="70" rx="14" fill="url(#pink)"/>
    <path d="m408 525 18 18 36-42" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#850044" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M327 356c14-25 45-25 59 0"/>
      <path d="M491 356c14-25 45-25 59 0"/>
      <path d="M414 370c12 22 43 22 55 0"/>
    </g>
    <circle cx="326" cy="397" r="17" fill="#ffb8c8"/>
    <circle cx="552" cy="397" r="17" fill="#ffb8c8"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="611" cy="515" r="118" fill="url(#pink)" stroke="#c90062" stroke-width="14"/>
    <circle cx="611" cy="515" r="83" fill="#fffffe"/>
    <g stroke="#850044" stroke-width="13" stroke-linecap="round">
      <path d="M611 463v-25"/>
      <path d="M611 592v-25"/>
      <path d="M559 515h-25"/>
      <path d="M688 515h-25"/>
      <path d="M611 515l55-48"/>
      <path d="M611 515l-39-30"/>
    </g>
    <circle cx="611" cy="515" r="17" fill="#ff3f88"/>
  </g>

  <g fill="none" stroke="#ff3f88" stroke-width="24" stroke-linecap="round">
    <path d="M697 284l24-44"/>
    <path d="M732 337l50-29"/>
  </g>

  <text x="450" y="770" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="900">
    <tspan fill="url(#darkPink)">Deadline </tspan><tspan fill="#ff3f88">Buddy</tspan>
  </text>
